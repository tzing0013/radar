name: Summary Table Demo
on: push

jobs:
  cache-workflow:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout 代码 ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. 恢复缓存文件 ──────────────────────────────────────────
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./my-cache/data.json
          key: demo-cache-v1
          lookup-only: false

      # ─── 3A. 缓存命中 → 打印缓存内容 ──────────────────────────────
      - name: Print cached content (cache hit)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          echo "✅ 缓存恢复成功，文件内容如下："
          echo "─────────────────────────────"
          cat ./my-cache/data.json
          echo ""
          echo "─────────────────────────────"

      # ─── 3B. 缓存未命中 → 重新写入文件 ─────────────────────────────
      - name: Write file
        run: |
          echo "⚠️ 缓存恢复失败，正在创建新文件..."
          mkdir -p ./my-cache
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"count\": 0, \"updated_at\": \"${TIMESTAMP}\", \"note\": \"initialized\"}" > ./my-cache/data.json
          echo "📄 初始文件已写入："
          cat ./my-cache/data.json

      # ─── 4. 缓存文件（仅在未命中时执行 save） ─────────────────────
      - name: Save to cache
        uses: actions/cache/save@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
        with:
          path: ./my-cache/data.json
          key: demo-cache-v1

